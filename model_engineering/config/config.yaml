defaults:
  - model: vgg16
  - _self_

training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: sgd  # sgd, adam
  scheduler: plateau  # plateau, step, cosine
  patience: 7
  min_delta: 0.001
  unfreeze_blocks: 0  # 0=frozen, 1=ultimo bloco, -1=todos
  pos_weight: 0  # 0=desativado, >0 pondera classe positiva (ex: 1.955 = psoríase/dermatite)

data:
  csv: dataset.csv
  folds: 4
  fold: 1
  preprocessed_dir: ""  # se preenchido, usa imagens pré-processadas (pula OpenCV online)

preprocessing:
  opencv: true        # pipeline OpenCV online (denoise + grayscale + equalizeHist)
  grayscale: true     # grayscale c/ 3 canais idênticos (false = RGB original)
  input_size: 512     # alvo do resize/crop (224 = tamanho nativo do ImageNet)
  crop: center        # center | random (RandomResizedCrop no treino) | letterbox (sem perda, padding central)
  random_erasing: false

# front-end de reducao ANTES do backbone (reduz input_size pela metade):
#   none: sem front-end (backbone recebe input_size)
#   avg:  AveragePool2d(s=2) - downscale fixo
#   conv: Conv2d k=32 s=2 - filtro grande gaussiano, APRENDIDO (anti-aliasing)
# Usar com input_size par (ex.: 1024 -> backbone recebe 512).
frontend: none

results_dir: ../cnn-skin-model-runs  # tudo versionado via Git LFS: mlflow/, tensorboard/, hydra/, metrics/

hydra:
  run:
    dir: ${results_dir}/hydra/${model}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${results_dir}/hydra/multirun/${model}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job_logging:
    root:
      handlers: [console, file]

seed: 42
dp: false
